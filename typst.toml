[package]
name = "stockholm-syndrome"
version = "0.1.0"
entrypoint = "stockholm-syndrome.typ"
authors = ["Robin Eklind"]
license = "MPL-2.0"
description = "A poster template with custom frame placement."
categories = ["office"]
repository = "https://github.com/mewmew/stockholm-syndrome"
exclude = [
    "examples",
    "tests",
    "docs",
    ".github",
    ".vscode",
    ".git",
    ".gitignore",
    "**/*.pdf",
]

[template]
path = "template"
entrypoint = "main.typ"
thumbnail = "thumbnail.png"
